<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django To-Do App</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        form { display: flex; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 5px 0 0 5px; outline: none; }
        input[type="submit"] { padding: 12px 20px; background: #2ecc71; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; font-weight: bold; }
        input[type="submit"]:hover { background: #27ae60; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { background: #f9f9f9; padding: 12px; margin-bottom: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3498db; }
        .delete-btn { color: #e74c3c; text-decoration: none; font-weight: bold; font-size: 18px; padding: 0 5px; }
        .delete-btn:hover { color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h2>My Task Manager</h2>
        
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="title" placeholder="Enna pannanum ipo?..." required>
            <input type="submit" value="Add">
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    <span>{{ task.title }}</span>
                    <a class="delete-btn" href="{% url 'delete_task' task.id %}">&times;</a>
                </li>
            {% empty %}
                <li style="border-left: 4px solid #95a5a6; color: #7f8c8d;">No tasks for today! Enjoy! 😎</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
